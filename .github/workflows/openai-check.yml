name: OpenAI connection check
on:
  workflow_dispatch:
  # Bootstrap exactly once with the dedicated commit message below.
  # Ordinary pushes, PRs and website edits never call the paid API.
  push:
    branches: [main]
    paths: ['.github/workflows/openai-check.yml']
permissions:
  contents: read
concurrency:
  group: openai-connection-check
  cancel-in-progress: false
jobs:
  connection:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run one OpenAI connection check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One bounded request using repository secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/openai-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: openai-connection-check
          path: work/openai-check.json
          retention-days: 1
